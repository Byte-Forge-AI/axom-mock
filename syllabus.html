  <h3 style="font-size:1rem;margin:1em 0 .2em" data-en="Which subjects are in the Assam Police Constable (AB/UB) written test?" data-as="অসম আৰক্ষী কনষ্টেবল (AB/UB) লিখিত পৰীক্ষাত কোন কোন বিষয় থাকে?"></h3>
  <p style="margin-top:0" data-en="The SLPRB Assam advertisement dated 05-12-2025 lists five subjects: Elementary Arithmetic; General English; Logical Reasoning / Mental Ability; Assam's History, Geography, Polity and Economy; General Awareness / General Knowledge and Current Affairs. Confirm on slprbassam.in." data-as="SLPRB অসমৰ 05-12-2025 তাৰিখৰ বিজ্ঞাপনত পাঁচটা বিষয় আছে: প্ৰাথমিক পাটীগণিত (Elementary Arithmetic); সাধাৰণ ইংৰাজী (General English); যুক্তি / মানসিক সামৰ্থ্য (Logical Reasoning / Mental Ability); অসমৰ বুৰঞ্জী, ভূগোল, ৰাজনীতি আৰু অৰ্থনীতি (Assam's History, Geography, Polity and Economy); সাধাৰণ সজাগতা / সাধাৰণ জ্ঞান আৰু সাম্প্ৰতিক ঘটনা (General Awareness / General Knowledge and Current Affairs)। slprbassam.in ত নিশ্চিত কৰক।"></p>
  <h3 style="font-size:1rem;margin:1em 0 .2em" data-en="What is the level of the questions?" data-as="প্ৰশ্নৰ মান কিমান?"></h3>
  <p style="margin-top:0" data-en="The SLPRB Assam advertisement dated 05-12-2025 says the questions are of Class IX and X level. Confirm on slprbassam.in." data-as="SLPRB অসমৰ 05-12-2025 তাৰিখৰ বিজ্ঞাপন অনুসৰি প্ৰশ্নবোৰ নৱম আৰু দশম শ্ৰেণীৰ মানৰ। slprbassam.in ত নিশ্চিত কৰক।"></p>
