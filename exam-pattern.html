  <h1 data-en="Assam Police Constable (AB/UB) written test pattern" data-as="অসম আৰক্ষী কনষ্টেবল (AB/UB) লিখিত পৰীক্ষাৰ আৰ্হি (Exam Pattern)"></h1>
  <p class="sub" data-en="Number of questions, marks, negative marking, subjects and stages of selection, as given in the SLPRB Assam advertisement dated 05-12-2025." data-as="প্ৰশ্নৰ সংখ্যা, নম্বৰ, ঋণাত্মক নম্বৰ, বিষয় আৰু নিৰ্বাচনৰ পৰ্যায়, SLPRB অসমৰ 05-12-2025 তাৰিখৰ বিজ্ঞাপনত দিয়া অনুসৰি।"></p>

  <div class="facts">

    <div><b>0</b><small data-en="negative marking" data-as="ঋণাত্মক নম্বৰ নাই"></small></div>
    <div><b>5</b><small data-en="subjects" data-as="টা বিষয়"></small></div>
  </div>

  <div class="card">
    <p style="margin:0" data-en="Source: SLPRB Assam advertisement No. SLPRB/REC/CONST (AB &amp; UB)/727/2025/94, dated 05-12-2025, for Constable (UB) and Constable (AB). Rules and dates can change. Candidates must confirm every detail on the official website slprbassam.in before they apply or prepare." data-as="উৎস: কনষ্টেবল (UB) আৰু কনষ্টেবল (AB) পদৰ বাবে SLPRB অসমৰ বিজ্ঞাপন নং SLPRB/REC/CONST (AB &amp; UB)/727/2025/94, তাৰিখ 05-12-2025। নিয়ম আৰু তাৰিখ সলনি হ'ব পাৰে। আবেদন বা প্ৰস্তুতিৰ আগতে প্ৰাৰ্থীসকলে প্ৰতিটো তথ্য চৰকাৰী ৱেবছাইট slprbassam.in ত নিশ্চিত কৰিব লাগে।"></p>
  </div>

  <h2 data-en="Written test details" data-as="লিখিত পৰীক্ষাৰ বিৱৰণ (Written Test)"></h2>
  <div class="card" style="overflow-x:auto"><table>
    <tr><th data-en="Questions" data-as="প্ৰশ্ন"></th><td data-en="100 multiple-choice questions, answered on an OMR sheet" data-as="100 টা বহুবিকল্পীয় প্ৰশ্ন (multiple-choice), OMR sheet ত উত্তৰ দিব লাগে"></td></tr>

    <tr><th data-en="Total marks" data-as="মুঠ নম্বৰ"></th><td data-en="50" data-as="50"></td></tr>
    <tr><th data-en="Negative marking" data-as="ঋণাত্মক নম্বৰ (Negative marking)"></th><td data-en="None" data-as="নাই"></td></tr>
    <tr><th data-en="Level of questions" data-as="প্ৰশ্নৰ মান"></th><td data-en="Class IX and X level" data-as="নৱম আৰু দশম শ্ৰেণীৰ মান"></td></tr>
    <tr><th data-en="Language of the paper" data-as="প্ৰশ্নকাকতৰ ভাষা"></th><td data-en="Assamese, Bodo, Bengali or English" data-as="অসমীয়া, বড়ো, বাংলা বা ইংৰাজী"></td></tr>
    <tr><th data-en="Time allowed" data-as="সময়"></th><td data-en="Not stated in this advertisement" data-as="এই বিজ্ঞাপনত উল্লেখ নাই"></td></tr>
  </table></div>
  <p class="note" data-en="The 90-minute timer in our free tests is our own practice timer. It is not the exam time." data-as="আমাৰ বিনামূলীয়া টেষ্টৰ 90 মিনিটৰ টাইমাৰ আমি নিজে অনুশীলনৰ বাবে ৰখা। এইটো পৰীক্ষাৰ সময় নহয়।"></p>

  <h2 data-en="Subjects in the written test" data-as="লিখিত পৰীক্ষাৰ বিষয়"></h2>
  <div class="card"><ul style="margin:0;padding-left:1.2em">
    <li data-en="Elementary Arithmetic" data-as="প্ৰাথমিক পাটীগণিত (Elementary Arithmetic)"></li>
    <li data-en="General English" data-as="সাধাৰণ ইংৰাজী (General English)"></li>
    <li data-en="Logical Reasoning / Mental Ability" data-as="যুক্তি / মানসিক সামৰ্থ্য (Logical Reasoning / Mental Ability)"></li>
    <li data-en="Assam's History, Geography, Polity and Economy" data-as="অসমৰ বুৰঞ্জী, ভূগোল, ৰাজনীতি আৰু অৰ্থনীতি (Assam's History, Geography, Polity and Economy)"></li>
    <li data-en="General Awareness / General Knowledge and Current Affairs" data-as="সাধাৰণ সজাগতা / সাধাৰণ জ্ঞান আৰু সাম্প্ৰতিক ঘটনা (General Awareness / General Knowledge and Current Affairs)"></li>
  </ul></div>
  <p class="note" data-en="The advertisement lists these subjects together for the 100 questions. It does not give the number of questions for each subject. For topics, see the syllabus page." data-as="বিজ্ঞাপনত এই বিষয়বোৰ 100 টা প্ৰশ্নৰ বাবে একেলগে দিয়া আছে। প্ৰতিটো বিষয়ৰ প্ৰশ্নৰ সংখ্যা দিয়া নাই। বিষয়বোৰৰ বিস্তাৰিত জানিবলৈ পাঠ্যক্ৰমৰ পৃষ্ঠা চাওক।"></p>

  <h2 data-en="Stages of selection" data-as="নিৰ্বাচনৰ পৰ্যায় (Stages of Selection)"></h2>
  <div class="card"><ol style="margin:0;padding-left:1.2em">
    <li data-en="Physical Efficiency Test (PET) and Medical Examination, followed by the Physical Standard Test (PST). The PST carries no marks." data-as="শাৰীৰিক সামৰ্থ্য পৰীক্ষা (Physical Efficiency Test, PET) আৰু চিকিৎসা পৰীক্ষা (Medical Examination); তাৰ পিছত শাৰীৰিক মান পৰীক্ষা (Physical Standard Test, PST)। PST ত কোনো নম্বৰ নাই।"></li>
    <li data-en="Written Test. In each category, candidates are called up to 5 times the number of vacancies, in the order of their PET marks." data-as="লিখিত পৰীক্ষা (Written Test)। প্ৰতিটো শ্ৰেণীত (category) পদৰ সংখ্যাৰ 5 গুণলৈ প্ৰাৰ্থীক PET ৰ নম্বৰৰ ক্ৰমত মাতা হয়।"></li>
    <li data-en="Oral / Viva-Voce. Candidates are called up to 2 times the number of vacancies, based on their PET and written test marks." data-as="মৌখিক পৰীক্ষা (Oral / Viva-Voce)। পদৰ সংখ্যাৰ 2 গুণলৈ প্ৰাৰ্থীক PET আৰু লিখিত পৰীক্ষাৰ নম্বৰৰ ভিত্তিত মাতা হয়।"></li>
  </ol></div>

  <h2 data-en="Marks in the final merit" data-as="চূড়ান্ত মেৰিটৰ নম্বৰ (Final Merit)"></h2>
  <div class="card" style="overflow-x:auto"><table>

    <tr><td data-en="Constable (AB), male" data-as="কনষ্টেবল (AB), পুৰুষ"></td><td>60</td><td>50</td><td>5</td><td>–</td><td>115</td></tr>
    <tr><td data-en="Constable (AB), female" data-as="কনষ্টেবল (AB), মহিলা"></td><td>40</td><td>50</td><td>5</td><td>–</td><td>95</td></tr>
  </table></div>
  <p class="note" data-en="Academic marks apply to Constable (UB) only and are given on the basis of the HS result. For PET events, PST heights and the rules for each category, read the full advertisement on slprbassam.in." data-as="একাডেমিক নম্বৰ কেৱল কনষ্টেবল (UB) ৰ বাবে আৰু HS ৰ ফলাফলৰ ভিত্তিত দিয়া হয়। PET ৰ ইভেন্ট, PST ৰ উচ্চতা আৰু প্ৰতিটো শ্ৰেণীৰ নিয়ম জানিবলৈ slprbassam.in ত সম্পূৰ্ণ বিজ্ঞাপন পঢ়ক।"></p>

<h2 data-en="Questions and answers" data-as="প্ৰশ্ন আৰু উত্তৰ"></h2>
  <h3 style="font-size:1rem;margin:1em 0 .2em" data-en="How many questions and marks are in the Assam Police Constable (AB/UB) written test?" data-as="অসম আৰক্ষী কনষ্টেবল (AB/UB) লিখিত পৰীক্ষাত কিমান প্ৰশ্ন আৰু নম্বৰ থাকে?"></h3>
  <p style="margin-top:0" data-en="The SLPRB Assam advertisement dated 05-12-2025 says the written test has 100 multiple-choice questions on an OMR sheet. Each correct answer gives half a mark, so the total is 50 marks. Confirm on slprbassam.in." data-as="SLPRB অসমৰ 05-12-2025 তাৰিখৰ বিজ্ঞাপন অনুসৰি লিখিত পৰীক্ষাত OMR sheet ত উত্তৰ দিবলগীয়া 100 টা বহুবিকল্পীয় প্ৰশ্ন (multiple-choice questions) থাকে। প্ৰতিটো শুদ্ধ উত্তৰৰ বাবে আধা নম্বৰ, গতিকে মুঠ 50 নম্বৰ। slprbassam.in ত নিশ্চিত কৰক।"></p>
  <h3 style="font-size:1rem;margin:1em 0 .2em" data-en="Is there negative marking in the Assam Police Constable written test?" data-as="অসম আৰক্ষী কনষ্টেবল লিখিত পৰীক্ষাত ঋণাত্মক নম্বৰ (negative marking) আছেনে?"></h3>
  <p style="margin-top:0" data-en="No. The SLPRB Assam advertisement dated 05-12-2025 gives no negative marking for the written test. Confirm on slprbassam.in." data-as="নাই। SLPRB অসমৰ 05-12-2025 তাৰিখৰ বিজ্ঞাপনত লিখিত পৰীক্ষাৰ বাবে ঋণাত্মক নম্বৰ (negative marking) নাই। slprbassam.in ত নিশ্চিত কৰক।"></p>
  <h3 style="font-size:1rem;margin:1em 0 .2em" data-en="Which subjects are in the written test?" data-as="লিখিত পৰীক্ষাত কোন কোন বিষয় থাকে?"></h3>
  <p style="margin-top:0" data-en="The SLPRB Assam advertisement dated 05-12-2025 lists five subjects: Elementary Arithmetic; General English; Logical Reasoning / Mental Ability; Assam's History, Geography, Polity and Economy; General Awareness / General Knowledge and Current Affairs. Confirm on slprbassam.in." data-as="SLPRB অসমৰ 05-12-2025 তাৰিখৰ বিজ্ঞাপনত পাঁচটা বিষয় আছে: প্ৰাথমিক পাটীগণিত (Elementary Arithmetic); সাধাৰণ ইংৰাজী (General English); যুক্তি / মানসিক সামৰ্থ্য (Logical Reasoning / Mental Ability); অসমৰ বুৰঞ্জী, ভূগোল, ৰাজনীতি আৰু অৰ্থনীতি (Assam's History, Geography, Polity and Economy); সাধাৰণ সজাগতা / সাধাৰণ জ্ঞান আৰু সাম্প্ৰতিক ঘটনা (General Awareness / General Knowledge and Current Affairs)। slprbassam.in ত নিশ্চিত কৰক।"></p>
  <h3 style="font-size:1rem;margin:1em 0 .2em" data-en="What are the stages of selection for Constable (AB/UB)?" data-as="কনষ্টেবল (AB/UB) ৰ নিৰ্বাচনৰ পৰ্যায়বোৰ কি কি?"></h3>
  <p style="margin-top:0" data-en="The advertisement dated 05-12-2025 lists: Physical Efficiency Test (PET) and Medical Examination, followed by the Physical Standard Test (PST); then the Written Test; then the Oral / Viva-Voce. Confirm on slprbassam.in." data-as="05-12-2025 তাৰিখৰ বিজ্ঞাপনত আছে: শাৰীৰিক সামৰ্থ্য পৰীক্ষা (Physical Efficiency Test, PET) আৰু চিকিৎসা পৰীক্ষা (Medical Examination), তাৰ পিছত শাৰীৰিক মান পৰীক্ষা (Physical Standard Test, PST); তাৰ পিছত লিখিত পৰীক্ষা (Written Test); তাৰ পিছত মৌখিক পৰীক্ষা (Oral / Viva-Voce)। slprbassam.in ত নিশ্চিত কৰক।"></p>
